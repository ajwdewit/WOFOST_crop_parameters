# Crop parameter file for use with the PCSE/WISS implementations of the WOFOST
# crop simulation model
#
# Creation date: 2026-09-09
#
# Contact: Allard de Wit (allard.dewit@wur.nl)
#          Wageningen University and Research Centre
#          PO Box 47, 6700 AA Wageningen, The Netherlands
#
# More information: - http://pcse.readthedocs.io
#                   - http://www.wageningenur.nl/wofost
#                   - https://github.com/ajwdewit/WOFOST_crop_parameters
#
# How the Values were derived
#
# *AMAXTB*
# 31.2 += 1.9 micromol/m2/sec equals 49.4 kg CO2/ha/hr from Tang et al
# Reduction in AMAX with DVS based Lithuanian calibration
#
# Base temperatures (TBASEM and DTSMTB)
# Derived from Lithuanian study
#
# TSUM1/TSUM2/TSUMEM
# Estimated from Lithuanian study mentioning local cycle length of 135 days
#
# TWDI
# EStimated from Lithuanian study as:
# 16 * 0.000669/0.00075 = 14.272  # equivalent initial leaf biomass in kg/ha
# TDWI = 14.272/0.4/0.5 = initial dry weight to reach initial leaf area [kg/ha]



Version: 1.0.0
Metadata: &meta
    Creator: Allard de Wit
    Contributor: 
    Contact: allard.dewit@wur.nl
    Publisher: Wageningen Environmental Research
    Title: Parameter sets for the WOFOST7.2/7.3 model for simulating hemp
    Date: 2022-02-13
    Language: EN
    Format: YAML
    Subject: WOFOST parameters for hemp
    Description: This file provides parameters for a hemp variety calibrated on
         experimental data from Lithuania. The original parameters were derived for SUCROS, those have been converted to WOFOST while
         Photosynthesis parameters were derived from Tang et al (2017)
    Identifier:
    Relation:
    Source: https://doi.org/10.1016/j.eja.2022.126576; https://doi.org/10.1111/gcbb.12451
    Type: article
    Coverage:
       Region: Northern and Western Europe
    Rights: European Union Public License (EUPL)
    Keyword: Hemp; Cannabis sativa 
CropParameters:
    GenericC3: &GenericC3
        CO2EFFTB:
         - [40., 0.00,
           360., 1.00,
           720., 1.11,
          1000., 1.11,
          2000., 1.11]
         - multiplication factor for EFF to account for an increasing CO2 concentration
         - ['PPM', '-']
        CO2TRATB:
         - [40., 1.00,
           360., 1.00,
           720., 0.9,
          1000., 0.9,
          2000., 0.9]
         - multiplication factor for maximum transpiration rate TRAMX to account for an increasing CO2 concentration
         - ['PPM', '-']
        CO2AMAXTB:
         - [40.,  0.00,
           360.,  1.00,
           720.,  1.60,
           1000., 1.90,
           2000., 1.90]
         - multiplication factor for AMAX to account for an increasing CO2 concentration
         - ['PPM', '-']
    GenericC4: &GenericC4
        CO2EFFTB:
         - [40., 0.00,
           360., 1.00,
           720., 1.00,
          1000., 1.00,
          2000., 1.00]
         - multiplication factor for EFF to account for an increasing CO2 concentration
         - ['PPM', '-']
        CO2TRATB:
         - [40., 1.00,
           360., 1.00,
           720., 0.74,
          1000., 0.74,
          2000., 0.74]
         - multiplication factor for maximum transpiration rate TRAMX to account for an increasing CO2 concentration
         - ['PPM', '-']
        CO2AMAXTB:
         - [40.,  0.00,
           360.,  1.00,
           720.,  1.00,
           1000., 1.00,
           2000., 1.00]
         - multiplication factor for AMAX to account for an increasing CO2 concentration
         - ['PPM', '-']
    EcoTypes:
        hemp: &hemp
            <<: *GenericC3
            #
            # EMERGENCE
            #
            TBASEM:
            -  4.0
            - Lower threshold temperature for emergence
            - ['C']
            TEFFMX:
            - 30.0
            - maximum effective temperature for emergence
            - ['C']
            TSUMEM:
            -  110
            - temperature sum from sowing to emergence
            - ['C.d']
            #
            # PHENOLOGICAL DEVELOPMENT
            #
            IDSL:
            -  0
            - indicates whether pre-anthesis development depends on temperature (=0), plus daylength (=1) , plus vernalization (=2)
            - ['NA']
            DLO:
            - -99.0
            - optimum daylength for development
            - ['hr']
            DLC:
            - -99.0
            - critical daylength (lower threshold)
            - ['hr']
            TSUM1:
            -  800
            - temperature sum from emergence to anthesis
            - ['C.d']
            TSUM2:
            -  750
            - temperature sum from anthesis to maturity
            - ['C.d']
            DTSMTB:
            - [ 0.0,  4.0,
               35.0, 31.0,
               45.0, 35.0]
            - daily increase in temperature sum as function of daily average temperature
            - ['C', 'C']
            DVSI:
            -  0.0
            - Initial development stage
            - ['-']
            DVSEND:
            -  2.0
            - development stage at harvest (= 2.0 at maturity)
            - ['-']
            VERNBASE:
            - 14.0
            - Base vernalization requirement
            - ['d']
            VERNSAT:
            - 70.0
            - Saturated vernalization requirement
            - ['d']
            VERNDVS:
            - 0.30
            - Critical DVS for vernalization to switch off
            - ['-']
            VERNRTB:
            - [-8.0,  0.0,
               -4.0,  0.0,
                3.0,  1.0,
               10.0,  1.0,
               17.0,  0.0,
               20.0,  0.0]
            - Temperature response function for vernalization
            - ['C', '-']
            #
            # INITIAL STATES
            #
            TDWI:
            -  14.30
            - initial total crop dry weight
            - ['kg.ha-1']
            RGRLAI:
            - 0.0075
            - maximum relative increase in LAI
            - ['d-1']
            #
            # CROP GREEN AREA
            #
            SLATB:
            - [0.00, 0.000750,
               2.00, 0.000750]
            - specific leaf area as a function of DVS
            - ['-', 'ha.kg-1']
            SPA:
            - 0.0000
            - specific pod area
            - ['ha.kg-1']
            SSATB:
            - [0.00, 0.0000,
               2.00, 0.0000]
            - specific stem area as function of DVS
            - ['-', 'ha.kg-1']
            SPAN:
            - 25.0
            - life span of leaves growing at 35 Celsius
            - ['d']
            TBASE:
            -  0.0
            - lower threshold temperature for ageing of leaves
            - ['C']
            #
            # CO2 ASSIMILATION
            #
            KDIFTB:
            - [0.00, 0.440,
               2.00, 0.440]
            - extinction coefficient for diffuse visible light as function of DVS
            - ['-', '-']
            EFFTB:
            - [ 0.0, 0.470,
               40.0, 0.470]
            - initial light-use efficiency single leaf as function of daily mean temperature
            - ['C', 'kg.ha-1.hr-1.J-1.m2.s1']
            AMAXTB:
            - [0.00, 49.40,
               1.60, 49.40,
               2.00, 24.70]
            - maximum leaf CO2 assimilation rate as function of DVS
            - ['-', 'kg.ha-1.hr-1']
            REFCO2L:
            - 360
            - CO2 level at which AMAX and EFF were measured
            - ['PPM']
            TMPFTB:
            - [  0.0, 0.00,
                 9.0, 0.70,
                16.0, 0.80,
                18.0, 0.94,
                20.0, 1.0,
                30.0, 1.0,
                35.0, 0.5,
                40.0, 0.0]
            - reduction factor of AMAX as function of average daytime (*not* daily)  temperature
            - ['C', '-']
            TMNFTB:
            - [ 0.0, 0.000,
                3.0, 1.000]
            - reduction factor of gross assimilation rate as function of low minimum temperature
            - ['C', '-']
            #
            # CONVERSION EFFICIENCY OF ASSIMILATES
            #
            CVL:
            - 0.720
            - efficiency of conversion into leaves
            - ['mass.mass-1']
            CVO:
            - 0.740
            - efficiency of conversion into storage organs
            - ['mass.mass-1']
            CVR:
            - 0.720
            - efficiency of conversion into roots
            - ['mass.mass-1']
            CVS:
            - 0.690
            - efficiency of conversion into stems
            - ['mass.mass-1']
            #
            # RESPIRATION
            #
            Q10:
            -  2.00
            - relative increase in respiration rate per 10 degrees Celsius temperature increase
            - ['-']
            RML:
            - 0.0300
            - relative maintenance respiration rate of leaves
            - ['d-1']
            RMO:
            - 0.0100
            - relative maintenance respiration rate of storage organs
            - ['d-1']
            RMR:
            - 0.0100
            - relative maintenance respiration rate of roots
            - ['d-1']
            RMS:
            - 0.0150
            - relative maintenance respiration rate of stems
            - ['d-1']
            RFSETB:
            - [0.00, 1.000,
               2.00, 1.000]
            - reduction factor for senescence as function of DVS
            - ['-', '-']
            #
            # PARTITIONING
            #
            FRTB:
            - [0.00, 0.600,
               0.80, 0.0,
               2.000, 0.000]
            - fraction of total dry matter to roots as a function of DVS
            - ['-', 'mass.mass-1']
            FLTB:
            - [0.000, 0.500,
               0.800, 0.600,
               1.500, 0.800,
               2.000, 0.000]
            - fraction of total dry matter to leaves as a function of DVS
            - ['-', 'mass.mass-1']
            FSTB:
            - [0.000, 0.000,
               0.250, 0.000,
               0.800, 0.600,
               1.500, 0.700,
               1.010, 0.150,
               2.000, 0.000]
            - fraction of total dry matter to stems as a function of DVS
            - ['-', 'mass.mass-1']
            FOTB:
            - [0.000, 0.000,
               0.800, 0.000,
               1.000, 0.000,
               1.010, 0.850,
               2.000, 1.000]
            - fraction of total dry matter to storage organs as a function of DVS
            - ['-', 'mass.mass-1']
            #
            # DEATH RATES
            #
            PERDL:
            - 0.030
            - maximum relative death rate of leaves due to water stress
            - ['-']
            RDRRTB:
            - [0.00, 0.000,
               1.50, 0.000,
               1.51, 0.020,
               2.00, 0.020]
            - Relative death rate of stems as a function of DVS
            - ['-', 'kg.kg-1.d-1']
            RDRSTB:
            - [0.00, 0.000,
               1.50, 0.000,
               1.51, 0.020,
               2.00, 0.020]
            - relative death rate of roots as a function of DVS
            - ['-', 'kg.kg-1.d-1']
            #
            # WATER USE
            #
            CFET:
            - 1.00
            - correction factor transpiration rate
            - ['-']
            DEPNR:
            - 4.50
            - crop group number for soil water depletion
            - ['-']
            IAIRDU:
            -  0
            - air ducts in roots present (=1) or not (=0)
            - ['NA']
            IOX:
            -  0
            - Oxygen stress effect enabled (=1) or not (=0)
            - ['NA']
            #
            # ROOTING DEPTH
            #
            RDI:
            -  10.0
            - initial rooting depth
            - ['cm']
            RRI:
            - 2.00
            - maximum daily increase in rooting depth
            - ['cm.d-1']
            RDMCR:
            - 120.0
            - maximum rooting depth
            - ['cm']
    Varieties:
        Felina32:
            <<: *hemp
            Metadata:
                <<: *meta
                Description: Hemp variety calibrated on data from Lithuania, but 
                    this cultivar is well adapted to the Atlantic climate and is widely grown in various parts of Europe. This variety was selected due to its suitability to be grown for flowers, seeds and fibre because it reaches full maturity under Northern climate conditions. 
            TSUM1:
            -  800
            - temperature sum from emergence to anthesis
            - ['C.d']
            TSUM2:
            -  750
            - temperature sum from anthesis to maturity
            - ['C.d']
